<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Slot in with Murobbi</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* Halang overscroll & lancarkan paparan telefon */
    body {
      -webkit-tap-highlight-color: transparent;
    }
    .occupied-pattern {
      background-image: repeating-linear-gradient(45deg, rgba(244,63,94,0.08) 0, rgba(244,63,94,0.08) 8px, transparent 8px, transparent 16px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header Utama (Mesra Mobile) -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs px-4 py-3 md:py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">📖</span>
          <h1 class="text-lg md:text-2xl font-black tracking-tight text-slate-900">
            Slot in with Murobbi
          </h1>
          <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 uppercase">Live</span>
        </div>
        <p class="text-[11px] md:text-xs text-slate-500 font-medium truncate max-w-[260px] md:max-w-none">
          👑 Kak Nisa • Nabila • Fir • Farasya • Athirah • Sakinah
        </p>
      </div>

      <!-- Pilihan Paparan (Telefon / Jadual) -->
      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
        <button onclick="setViewMode('mobile')" id="btn-view-mobile" class="px-2.5 py-1 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-xs">
          📱 Kad
        </button>
        <button onclick="setViewMode('grid')" id="btn-view-grid" class="px-2.5 py-1 text-xs font-bold rounded-lg transition text-slate-600 hover:text-slate-900">
          📊 Jadual
        </button>
      </div>
    </div>

    <!-- Bar Navigasi Minggu -->
    <div class="max-w-6xl mx-auto mt-2 pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1">
        <button onclick="changeWeek(-1)" class="h-8 px-2.5 bg-slate-100 active:bg-slate-200 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold flex items-center gap-1 transition cursor-pointer">
          <i class="ph ph-caret-left font-bold"></i>
          <span class="hidden sm:inline">Lepas</span>
        </button>
        <button onclick="resetToThisWeek()" class="h-8 px-2.5 bg-indigo-50 active:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-black border border-indigo-200/60 transition cursor-pointer">
          ✨ Minggu Ini
        </button>
        <button onclick="changeWeek(1)" class="h-8 px-2.5 bg-slate-100 active:bg-slate-200 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold flex items-center gap-1 transition cursor-pointer">
          <span class="hidden sm:inline">Depan</span>
          <i class="ph ph-caret-right font-bold"></i>
        </button>
      </div>

      <div class="text-right">
        <div id="current-week-label" class="text-xs font-extrabold text-slate-800">Memuatkan...</div>
        <div id="active-week-badge" class="text-[9px] font-black uppercase text-indigo-600"></div>
      </div>
    </div>
  </header>

  <!-- Legend Status -->
  <div class="max-w-6xl mx-auto px-4 mt-3 flex flex-wrap items-center justify-center sm:justify-start gap-2 text-[11px] font-bold text-slate-600">
    <span class="flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-md border border-emerald-200">
      🟢 Available
    </span>
    <span class="flex items-center gap-1 bg-amber-50 text-amber-800 px-2 py-0.5 rounded-md border border-amber-200">
      🟡 Partial Free
    </span>
    <span class="flex items-center gap-1 bg-rose-50 text-rose-700 px-2 py-0.5 rounded-md border border-rose-200">
      🔴 Occupied
    </span>
  </div>

  <main class="max-w-6xl mx-auto px-3 md:px-4 mt-3">

    <!-- ============================================== -->
    <!-- 1. PAPARAN TELEFON (MOBILE VIEW - DAY TABS & CARDS) -->
    <!-- ============================================== -->
    <section id="mobile-view-container">
      <!-- Tab Pemilihan Hari (Swipeable di Telefon) -->
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-2 mb-2" id="mobile-day-tabs">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Kad-Kad Waktu bagi Hari Terpilih -->
      <div class="space-y-2.5" id="mobile-slots-container">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- ============================================== -->
    <!-- 2. PAPARAN JADUAL PENUH (GRID VIEW) -->
    <!-- ============================================== -->
    <section id="grid-view-container" class="hidden overflow-x-auto pb-6">
      <div class="min-w-[800px] bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
        <div id="grid-header" class="grid grid-cols-8 border-b border-slate-200 bg-slate-50/90 text-center text-xs font-extrabold text-slate-600 divide-x divide-slate-200">
        </div>
        <div id="calendar-body" class="divide-y divide-slate-100">
        </div>
      </div>
    </section>

  </main>

  <!-- ============================================== -->
  <!-- MODAL / BOTTOM SHEET UNTUK TOGGLE STATUS -->
  <!-- ============================================== -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs hidden flex items-end sm:items-center justify-center z-50 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl p-5 sm:p-6 relative border border-slate-100 max-h-[85vh] flex flex-col animate-in slide-in-from-bottom-5 duration-150">
      
      <!-- Pemegang Mobile (Handle bar) -->
      <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-3 sm:hidden"></div>

      <!-- Header Modal -->
      <div class="flex items-start justify-between mb-4">
        <div>
          <span id="modal-date-badge" class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 bg-indigo-100 text-indigo-800 rounded-md"></span>
          <h3 id="modal-title" class="text-lg font-black text-slate-900 mt-1.5 flex items-center gap-1.5"></h3>
          <p class="text-[11px] text-slate-500">Tekan suis untuk tukar status anda.</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full cursor-pointer">
          <i class="ph ph-x font-bold text-base"></i>
        </button>
      </div>

      <!-- Senarai Ahli Halaqah -->
      <div id="member-list" class="space-y-2 overflow-y-auto pr-1 flex-1 py-1">
      </div>

      <!-- Butang Selesai -->
      <div class="pt-3 mt-3 border-t border-slate-100">
        <button onclick="closeModal()" class="w-full py-3 bg-slate-900 active:bg-slate-800 text-white font-extrabold rounded-xl text-sm transition shadow-sm cursor-pointer">
          ✨ Selesai & Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-W8y02kRr2yOA2QANhEXy6xojbXJxsP4",
      authDomain: "calendar-train-of-trainer-apps.firebaseapp.com",
      databaseURL: "https://calendar-train-of-trainer-apps-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "calendar-train-of-trainer-apps",
      storageBucket: "calendar-train-of-trainer-apps.firebasestorage.app",
      messagingSenderId: "306554529468",
      appId: "1:306554529468:web:0e9874009239cf0eb652b9",
      measurementId: "G-5F6QLB72XJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Senarai Ahli
    const MEMBERS = [
      { id: "kak_nisa", name: "Kak Nisa", isMurobbi: true, emoji: "👑", role: "Murobbi" },
      { id: "nabila", name: "Nabila", isMurobbi: false, emoji: "🌸", role: "Ahli" },
      { id: "fir", name: "Fir", isMurobbi: false, emoji: "🌿", role: "Ahli" },
      { id: "farasya", name: "Farasya", isMurobbi: false, emoji: "✨", role: "Ahli" },
      { id: "athirah", name: "Athirah", isMurobbi: false, emoji: "🌷", role: "Ahli" },
      { id: "sakinah", name: "Sakinah", isMurobbi: false, emoji: "🍃", role: "Ahli" },
    ];

    // Pecahan Waktu (Tanpa set jam, ditambah waktu Qiam)
    const SLOTS = [
      { id: "qiam", label: "Qiam", emoji: "🌌" },
      { id: "pagi", label: "Pagi", emoji: "🌅" },
      { id: "tgh_hari", label: "Tgh Hari", emoji: "☀️" },
      { id: "petang", label: "Petang", emoji: "🌇" },
      { id: "malam", label: "Malam", emoji: "🌙" }
    ];

    let currentWeekOffset = 0;
    let weekDays = [];
    let selectedDayIndex = 0; // Untuk paparan mobile
    let viewMode = 'mobile'; // 'mobile' atau 'grid'
    let scheduleData = {};
    let activeSlotKey = null;
    let activeSlotMeta = null;

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function calculateWeekDates() {
      const now = new Date();
      const targetMonday = getMonday(now);
      targetMonday.setDate(targetMonday.getDate() + (currentWeekOffset * 7));

      const days = [];
      const dayNames = ["Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu", "Ahad"];
      const monthNames = ["Jan", "Feb", "Mac", "Apr", "Mei", "Jun", "Jul", "Ogo", "Sep", "Okt", "Nov", "Dis"];

      let todayIndexFound = -1;

      for (let i = 0; i < 7; i++) {
        const d = new Date(targetMonday);
        d.setDate(d.getDate() + i);

        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;
        const isToday = (d.toDateString() === (new Date()).toDateString());

        if (isToday) todayIndexFound = i;

        days.push({
          dateStr: dateStr,
          dayName: dayNames[i],
          shortDate: `${d.getDate()} ${monthNames[d.getMonth()]}`,
          isWeekend: (i >= 5),
          isToday: isToday
        });
      }

      weekDays = days;

      if (currentWeekOffset === 0 && todayIndexFound !== -1) {
        selectedDayIndex = todayIndexFound;
      } else if (selectedDayIndex > 6) {
        selectedDayIndex = 0;
      }

      // Label Header Minggu
      const first = days[0];
      const last = days[6];
      document.getElementById("current-week-label").innerHTML = `🗓️ ${first.shortDate} – ${last.shortDate}`;
      
      const badge = document.getElementById("active-week-badge");
      if (currentWeekOffset === 0) {
        badge.innerText = "Minggu Ini";
      } else if (currentWeekOffset > 0) {
        badge.innerText = `+${currentWeekOffset} Minggu Hadapan`;
      } else {
        badge.innerText = `${Math.abs(currentWeekOffset)} Minggu Sebelumnya`;
      }
    }

    // Kira Status Slot (Available / Partial / Occupied)
    function calculateSlotStatus(slotInfo) {
      if (!slotInfo) {
        return { status: "green", freeCount: MEMBERS.length, murobbiFree: true };
      }

      const isMurobbiFree = slotInfo["kak_nisa"] !== false;

      let freeCount = 0;
      MEMBERS.forEach(m => {
        if (slotInfo[m.id] !== false) freeCount++;
      });

      // Kak Nisa sibuk -> Occupied
      if (!isMurobbiFree) {
        return { status: "red", reason: "Kak Nisa Sibuk", freeCount, murobbiFree: false };
      }

      // Semua ahli sibuk -> Occupied
      if (freeCount <= 1) {
        return { status: "red", reason: "Semua Sibuk", freeCount, murobbiFree: true };
      }

      // Semua 6 orang lapang -> Available
      if (freeCount === MEMBERS.length) {
        return { status: "green", reason: "Available", freeCount, murobbiFree: true };
      }

      return { status: "yellow", reason: `${freeCount}/${MEMBERS.length} Free`, freeCount, murobbiFree: true };
    }

    // ==========================================
    // RENDER 1: PAPARAN MOBILE (KAD HARIAN)
    // ==========================================
    function renderMobileView() {
      // 1. Render Tab Hari
      const tabsContainer = document.getElementById("mobile-day-tabs");
      let tabsHTML = "";
      weekDays.forEach((day, idx) => {
        const isSelected = (idx === selectedDayIndex);
        tabsHTML += `
          <button onclick="window.selectMobileDay(${idx})" 
                  class="flex-shrink-0 flex flex-col items-center py-2 px-3.5 rounded-2xl border transition text-center cursor-pointer ${
                    isSelected 
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                      : 'bg-white text-slate-700 border-slate-200/80 hover:bg-slate-50'
                  }">
            <span class="text-[10px] uppercase font-extrabold ${isSelected ? 'text-indigo-200' : 'text-slate-400'}">${day.dayName}</span>
            <span class="text-xs font-black mt-0.5">${day.shortDate}</span>
            ${day.isToday ? `<span class="w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-amber-300' : 'bg-indigo-600'}"></span>` : ''}
          </button>
        `;
      });
      tabsContainer.innerHTML = tabsHTML;

      // 2. Render 5 Waktu Bagi Hari Terpilih
      const currentDay = weekDays[selectedDayIndex];
      const slotsContainer = document.getElementById("mobile-slots-container");
      let slotsHTML = "";

      SLOTS.forEach(slot => {
        const slotKey = `${currentDay.dateStr}_${slot.id}`;
        const slotInfo = scheduleData[slotKey] || {};
        const result = calculateSlotStatus(slotInfo);

        let borderClass = "border-slate-200 bg-white";
        let statusBadge = "";

        if (result.status === "green") {
          borderClass = "border-emerald-300 bg-emerald-50/40";
          statusBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-black bg-emerald-100 text-emerald-800 border border-emerald-200">🟢 Available</span>`;
        } else if (result.status === "yellow") {
          borderClass = "border-amber-300 bg-amber-50/40";
          statusBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-black bg-amber-100 text-amber-900 border border-amber-200">🟡 ${result.freeCount}/${MEMBERS.length} Free</span>`;
        } else {
          borderClass = "border-rose-300 bg-rose-50/60 occupied-pattern";
          statusBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-black bg-rose-100 text-rose-800 border border-rose-200">🔴 Occupied</span>`;
        }

        // Avatars
        let avatarsHTML = "";
        MEMBERS.forEach(m => {
          const isFree = slotInfo[m.id] !== false;
          avatarsHTML += `
            <span class="w-7 h-7 rounded-xl flex items-center justify-center text-xs border ${
              isFree ? 'bg-white border-slate-200 shadow-2xs' : 'bg-rose-500 text-white border-rose-300 opacity-60'
            }" title="${m.name}: ${isFree ? 'Free' : 'Sibuk'}">
              ${m.emoji}
            </span>
          `;
        });

        slotsHTML += `
          <div onclick="window.openDetail('${slotKey}', '${currentDay.dayName}', '${currentDay.shortDate}', '${slot.label}', '${slot.emoji}')"
               class="p-4 rounded-2xl border ${borderClass} shadow-xs active:scale-[0.99] transition cursor-pointer flex items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xl">${slot.emoji}</span>
                <span class="text-base font-black text-slate-900">${slot.label}</span>
              </div>
              <div class="flex items-center gap-1 mt-2.5">
                ${avatarsHTML}
              </div>
            </div>

            <div class="flex flex-col items-end gap-1.5">
              ${statusBadge}
              <span class="text-[11px] font-bold text-indigo-600 flex items-center gap-0.5">
                Pilih <i class="ph ph-caret-right font-bold"></i>
              </span>
            </div>
          </div>
        `;
      });

      slotsContainer.innerHTML = slotsHTML;
    }

    window.selectMobileDay = function(idx) {
      selectedDayIndex = idx;
      renderMobileView();
    };

    // ==========================================
    // RENDER 2: PAPARAN JADUAL PENUH (GRID)
    // ==========================================
    function renderCalendarGrid() {
      const headerContainer = document.getElementById("grid-header");
      let headerHTML = `
        <div class="p-3 flex items-center justify-center text-slate-400 bg-slate-100/70 font-black">
          <i class="ph ph-clock mr-1 text-sm"></i> WAKTU
        </div>
      `;

      weekDays.forEach(day => {
        headerHTML += `
          <div class="p-2.5 flex flex-col items-center justify-center relative ${day.isToday ? 'bg-indigo-50/80 text-indigo-950 font-extrabold' : ''}">
            ${day.isToday ? '<span class="text-[8px] font-black uppercase bg-indigo-600 text-white px-1.5 rounded-full mb-0.5">Hari Ini</span>' : ''}
            <span class="text-xs uppercase tracking-wider ${day.isWeekend ? 'text-indigo-600 font-black' : 'text-slate-700'}">${day.dayName}</span>
            <span class="text-[11px] font-medium text-slate-400">${day.shortDate}</span>
          </div>
        `;
      });
      headerContainer.innerHTML = headerHTML;

      const bodyContainer = document.getElementById("calendar-body");
      bodyContainer.innerHTML = "";

      SLOTS.forEach(slot => {
        const row = document.createElement("div");
        row.className = "grid grid-cols-8 divide-x divide-slate-100 items-stretch";

        let rowHTML = `
          <div class="p-3 bg-slate-50/70 flex flex-col justify-center items-center text-center">
            <span class="text-xl">${slot.emoji}</span>
            <span class="text-xs font-black text-slate-800 mt-1 uppercase">${slot.label}</span>
          </div>
        `;

        weekDays.forEach(day => {
          const slotKey = `${day.dateStr}_${slot.id}`;
          const slotInfo = scheduleData[slotKey] || {};
          const result = calculateSlotStatus(slotInfo);

          let cellClass = "bg-white";
          let badgeHTML = "";

          if (result.status === "green") {
            cellClass = "bg-emerald-50/50";
            badgeHTML = `<span class="text-[10px] font-black text-emerald-800 bg-white/95 px-1.5 py-0.5 rounded-md">🟢 Available</span>`;
          } else if (result.status === "yellow") {
            cellClass = "bg-amber-50/50";
            badgeHTML = `<span class="text-[10px] font-black text-amber-800 bg-white/95 px-1.5 py-0.5 rounded-md">🟡 ${result.freeCount}/${MEMBERS.length}</span>`;
          } else {
            cellClass = "bg-rose-50/80 occupied-pattern";
            badgeHTML = `<span class="text-[10px] font-black text-rose-700 bg-white px-1.5 py-0.5 rounded-md">🔴 Occupied</span>`;
          }

          rowHTML += `
            <div onclick="window.openDetail('${slotKey}', '${day.dayName}', '${day.shortDate}', '${slot.label}', '${slot.emoji}')"
                 class="p-2 min-h-[95px] cursor-pointer hover:bg-slate-100/80 transition flex flex-col justify-between items-center text-center ${cellClass}">
               <span class="text-[9px] font-bold text-slate-400 uppercase">${slot.label}</span>
               <div class="my-auto">${badgeHTML}</div>
               <span class="text-[9px] font-bold text-indigo-600">Tekan</span>
            </div>
          `;
        });

        row.innerHTML = rowHTML;
        bodyContainer.appendChild(row);
      });
    }

    // Tukar Mod Paparan (Telefon / Jadual)
    window.setViewMode = function(mode) {
      viewMode = mode;
      const mobileContainer = document.getElementById("mobile-view-container");
      const gridContainer = document.getElementById("grid-view-container");
      const btnMobile = document.getElementById("btn-view-mobile");
      const btnGrid = document.getElementById("btn-view-grid");

      if (mode === 'mobile') {
        mobileContainer.classList.remove("hidden");
        gridContainer.classList.add("hidden");
        btnMobile.className = "px-2.5 py-1 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-xs";
        btnGrid.className = "px-2.5 py-1 text-xs font-bold rounded-lg transition text-slate-600 hover:text-slate-900";
        renderMobileView();
      } else {
        mobileContainer.classList.add("hidden");
        gridContainer.classList.remove("hidden");
        btnGrid.className = "px-2.5 py-1 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-xs";
        btnMobile.className = "px-2.5 py-1 text-xs font-bold rounded-lg transition text-slate-600 hover:text-slate-900";
        renderCalendarGrid();
      }
    };

    // Modal Status Interaktif
    window.openDetail = function(slotKey, dayName, shortDate, slotLabel, slotEmoji) {
      activeSlotKey = slotKey;
      activeSlotMeta = { dayName, shortDate, slotLabel, slotEmoji };

      document.getElementById("modal-date-badge").innerText = `${dayName}, ${shortDate}`;
      document.getElementById("modal-title").innerHTML = `${slotEmoji} Slot ${slotLabel}`;

      const listContainer = document.getElementById("member-list");
      listContainer.innerHTML = "";

      const currentSlot = scheduleData[slotKey] || {};

      MEMBERS.forEach(member => {
        const isFree = currentSlot[member.id] !== false;
        const item = document.createElement("div");
        item.className = `flex items-center justify-between p-3 rounded-2xl border transition-all duration-150 ${
          isFree ? "bg-emerald-50/70 border-emerald-200 text-emerald-950" : "bg-rose-50/80 border-rose-200 text-rose-950"
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-9 h-9 rounded-xl flex items-center justify-center text-base ${
              member.isMurobbi ? "bg-amber-100 border border-amber-300 shadow-2xs" : "bg-white border border-slate-200"
            }">
              ${member.emoji}
            </span>
            <div>
              <div class="text-xs font-black flex items-center gap-1">
                ${member.name}
                ${member.isMurobbi ? '<span class="text-[8px] bg-rose-600 text-white font-black px-1.5 py-0.2 rounded-sm uppercase">Murobbi</span>' : ''}
              </div>
              <span class="text-[11px] font-semibold ${isFree ? 'text-emerald-700' : 'text-rose-600'}">
                ${isFree ? "🟢 Free" : "🔴 Sibuk"}
              </span>
            </div>
          </div>

          <button onclick="window.toggleStatus('${member.id}', ${!isFree})" 
                  class="relative inline-flex h-7 w-13 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${
                    isFree ? 'bg-emerald-500' : 'bg-rose-500'
                  }">
            <span class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-white shadow-md transition duration-200 ease-in-out flex items-center justify-center text-[10px] ${
              isFree ? 'translate-x-6' : 'translate-x-0'
            }">
              ${isFree ? '✔️' : '✖️'}
            </span>
          </button>
        `;

        listContainer.appendChild(item);
      });

      document.getElementById("detail-modal").classList.remove("hidden");
    };

    window.closeModal = function() {
      document.getElementById("detail-modal").classList.add("hidden");
    };

    // Toggle Realtime Firebase
    window.toggleStatus = async function(memberId, newStatus) {
      if (!scheduleData[activeSlotKey]) scheduleData[activeSlotKey] = {};
      scheduleData[activeSlotKey][memberId] = newStatus;

      try {
        const slotRef = ref(db, "weekly_schedule/" + activeSlotKey);
        await set(slotRef, scheduleData[activeSlotKey]);

        if (activeSlotMeta) {
          window.openDetail(
            activeSlotKey, 
            activeSlotMeta.dayName, 
            activeSlotMeta.shortDate, 
            activeSlotMeta.slotLabel, 
            activeSlotMeta.slotEmoji
          );
        }
      } catch (err) {
        console.error("Gagal simpan ke Firebase:", err);
      }
    };

    // Dengar perubahan masa nyata
    function listenToDatabase() {
      const scheduleRef = ref(db, "weekly_schedule");
      onValue(scheduleRef, (snapshot) => {
        scheduleData = snapshot.val() || {};
        if (viewMode === 'mobile') {
          renderMobileView();
        } else {
          renderCalendarGrid();
        }

        if (activeSlotKey && !document.getElementById("detail-modal").classList.contains("hidden")) {
          window.openDetail(
            activeSlotKey, 
            activeSlotMeta.dayName, 
            activeSlotMeta.shortDate, 
            activeSlotMeta.slotLabel, 
            activeSlotMeta.slotEmoji
          );
        }
      });
    }

    window.changeWeek = function(delta) {
      currentWeekOffset += delta;
      initView();
    };

    window.resetToThisWeek = function() {
      currentWeekOffset = 0;
      initView();
    };

    function initView() {
      calculateWeekDates();
      if (viewMode === 'mobile') {
        renderMobileView();
      } else {
        renderCalendarGrid();
      }
    }

    // Mulakan paparan
    initView();
    listenToDatabase();
  </script>
</body>
</html>
