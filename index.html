<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slot in with Murobbi</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .occupied-pattern {
      background-image: repeating-linear-gradient(45deg, rgba(244,63,94,0.06) 0, rgba(244,63,94,0.06) 8px, transparent 8px, transparent 16px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-3 md:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Bahagian Header -->
  <header class="max-w-7xl mx-auto mb-6 bg-white border border-slate-200 rounded-3xl p-5 md:p-6 shadow-xs">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="text-3xl">📖</span>
          <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-900">
            Slot in with Murobbi
          </h1>
          <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 uppercase">Live</span>
        </div>
        <p class="text-xs md:text-sm text-slate-500 mt-1 font-medium">
          👑 Kak Nisa • Nabila • Fir • Farasya • Athirah • Sakinah
        </p>
      </div>

      <!-- Navigasi Minggu -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 shadow-inner self-start md:self-auto">
        <button onclick="changeWeek(-1)" class="px-3 py-1.5 hover:bg-white text-slate-700 rounded-xl transition font-bold text-xs flex items-center gap-1">
          <i class="ph ph-caret-left font-bold"></i> Minggu Lepas
        </button>
        <button onclick="resetToThisWeek()" class="px-3 py-1.5 bg-white text-indigo-700 font-extrabold text-xs rounded-xl shadow-xs border border-slate-200 transition hover:bg-indigo-50">
          ✨ Minggu Ini
        </button>
        <button onclick="changeWeek(1)" class="px-3 py-1.5 hover:bg-white text-slate-700 rounded-xl transition font-bold text-xs flex items-center gap-1">
          Minggu Depan <i class="ph ph-caret-right font-bold"></i>
        </button>
      </div>
    </div>

    <!-- Info Tarikh Semasa & Legend Status -->
    <div class="mt-4 pt-4 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-sm md:text-base font-extrabold text-slate-800" id="current-week-label">Memuatkan tarikh...</span>
        <span id="active-week-badge" class="text-[10px] font-black uppercase px-2 py-0.5 rounded-md"></span>
      </div>

      <!-- Petunjuk Warna (Legend) -->
      <div class="flex flex-wrap items-center gap-2 text-xs font-bold text-slate-600">
        <span class="flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-xl border border-emerald-200">
          🟢 Semua Free
        </span>
        <span class="flex items-center gap-1 bg-amber-50 text-amber-800 px-2.5 py-1 rounded-xl border border-amber-200">
          🟡 Sebahagian Free
        </span>
        <span class="flex items-center gap-1 bg-rose-50 text-rose-700 px-2.5 py-1 rounded-xl border border-rose-200">
          🔴 Penuh / Kak Nisa Sibuk (Occupied)
        </span>
      </div>
    </div>
  </header>

  <!-- Jadual Mingguan (Timetable) -->
  <main class="max-w-7xl mx-auto overflow-x-auto pb-8">
    <div class="min-w-[980px] bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Header Hari (Isnin - Ahad) -->
      <div id="grid-header" class="grid grid-cols-8 border-b border-slate-200 bg-slate-50/90 text-center text-xs font-extrabold text-slate-600 divide-x divide-slate-200">
      </div>

      <!-- Baris Waktu (Pagi, Tgh Hari, Petang, Malam) -->
      <div id="calendar-body" class="divide-y divide-slate-100">
      </div>
    </div>
  </main>

  <!-- Modal Interaktif (Klik mana-mana petak untuk toggle status) -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-950/50 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 relative border border-slate-100">
      
      <!-- Butang Tutup (X) -->
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition">
        <i class="ph ph-x font-bold"></i>
      </button>

      <!-- Keterangan Slot -->
      <div class="mb-5">
        <span id="modal-date-badge" class="text-[11px] font-black uppercase tracking-wider px-2.5 py-1 bg-indigo-100 text-indigo-800 rounded-lg"></span>
        <h3 id="modal-title" class="text-xl font-black text-slate-900 mt-2 flex items-center gap-2"></h3>
        <p class="text-xs text-slate-500 mt-1">Tekan pada suis nama anda untuk tukar status (Free / Sibuk).</p>
      </div>

      <!-- Senarai Ahli & Switch -->
      <div id="member-list" class="space-y-2.5 mb-6 max-h-[360px] overflow-y-auto pr-1">
      </div>

      <!-- Butang Simpan -->
      <div class="pt-3 border-t border-slate-100">
        <button onclick="closeModal()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-extrabold rounded-2xl text-sm transition shadow-sm">
          ✨ Selesai & Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Kredensial Firebase anda yang telah dimasukkan
    const firebaseConfig = {
      apiKey: "AIzaSyC-W8y02kRr2yOA2QANhEXy6xojbXJxsP4",
      authDomain: "calendar-train-of-trainer-apps.firebaseapp.com",
      databaseURL: "https://calendar-train-of-trainer-apps-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "calendar-train-of-trainer-apps",
      storageBucket: "calendar-train-of-trainer-apps.firebasestorage.app",
      messagingSenderId: "306554529468",
      appId: "1:306554529468:web:0e9874009239cf0eb652b9",
      measurementId: "G-5F6QLB72XJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Senarai Ahli Halaqah
    const MEMBERS = [
      { id: "kak_nisa", name: "Kak Nisa", isMurobbi: true, emoji: "👑", role: "Murobbi" },
      { id: "nabila", name: "Nabila", isMurobbi: false, emoji: "🌸", role: "Ahli" },
      { id: "fir", name: "Fir", isMurobbi: false, emoji: "🌿", role: "Ahli" },
      { id: "farasya", name: "Farasya", isMurobbi: false, emoji: "✨", role: "Ahli" },
      { id: "athirah", name: "Athirah", isMurobbi: false, emoji: "🌷", role: "Ahli" },
      { id: "sakinah", name: "Sakinah", isMurobbi: false, emoji: "🍃", role: "Ahli" },
    ];

    // Pecahan Waktu Harian
    const SLOTS = [
      { id: "pagi", label: "Pagi", time: "08:30 - 11:30", emoji: "🌅" },
      { id: "tgh_hari", label: "Tgh Hari", time: "12:00 - 14:30", emoji: "☀️" },
      { id: "petang", label: "Petang", time: "15:30 - 18:30", emoji: "🌇" },
      { id: "malam", label: "Malam", time: "20:30 - 22:30", emoji: "🌙" }
    ];

    let currentWeekOffset = 0;
    let weekDays = [];
    let scheduleData = {};
    let activeSlotKey = null;
    let activeSlotMeta = null;
    let firestoreUnsubscribes = [];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function calculateWeekDates() {
      const now = new Date();
      const targetMonday = getMonday(now);
      targetMonday.setDate(targetMonday.getDate() + (currentWeekOffset * 7));

      const days = [];
      const dayNames = ["Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu", "Ahad"];
      const monthNames = ["Jan", "Feb", "Mac", "Apr", "Mei", "Jun", "Jul", "Ogo", "Sep", "Okt", "Nov", "Dis"];

      for (let i = 0; i < 7; i++) {
        const d = new Date(targetMonday);
        d.setDate(d.getDate() + i);

        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;

        const isToday = (d.toDateString() === (new Date()).toDateString());

        days.push({
          dateStr: dateStr,
          dayName: dayNames[i],
          shortDate: `${d.getDate()} ${monthNames[d.getMonth()]}`,
          isWeekend: (i >= 5),
          isToday: isToday
        });
      }

      weekDays = days;

      const first = days[0];
      const last = days[6];
      document.getElementById("current-week-label").innerHTML = `🗓️ ${first.shortDate} – ${last.shortDate}, ${first.dateStr.split('-')[0]}`;
      
      const badge = document.getElementById("active-week-badge");
      if (currentWeekOffset === 0) {
        badge.innerText = "Minggu Ini";
        badge.className = "text-[10px] font-black uppercase px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800";
      } else if (currentWeekOffset > 0) {
        badge.innerText = `+${currentWeekOffset} Minggu Hadapan`;
        badge.className = "text-[10px] font-black uppercase px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-800";
      } else {
        badge.innerText = `${Math.abs(currentWeekOffset)} Minggu Sebelumnya`;
        badge.className = "text-[10px] font-black uppercase px-2 py-0.5 rounded-md bg-slate-200 text-slate-700";
      }
    }

    function renderCalendarGrid() {
      const headerContainer = document.getElementById("grid-header");
      let headerHTML = `
        <div class="p-3 flex items-center justify-center text-slate-400 bg-slate-100/70 font-black">
          <i class="ph ph-clock mr-1 text-sm"></i> WAKTU
        </div>
      `;

      weekDays.forEach(day => {
        headerHTML += `
          <div class="p-3 flex flex-col items-center justify-center relative ${day.isToday ? 'bg-indigo-50/80 text-indigo-950 font-extrabold' : ''}">
            ${day.isToday ? '<span class="absolute top-1 text-[8px] font-black uppercase tracking-wider bg-indigo-600 text-white px-1.5 py-0.2 rounded-full">Hari Ini</span>' : ''}
            <span class="mt-2 text-xs uppercase tracking-wider ${day.isWeekend ? 'text-indigo-600 font-black' : 'text-slate-700'}">${day.dayName}</span>
            <span class="text-[11px] font-medium text-slate-400">${day.shortDate}</span>
          </div>
        `;
      });
      headerContainer.innerHTML = headerHTML;

      const bodyContainer = document.getElementById("calendar-body");
      bodyContainer.innerHTML = "";

      SLOTS.forEach(slot => {
        const row = document.createElement("div");
        row.className = "grid grid-cols-8 divide-x divide-slate-100 items-stretch";

        let rowHTML = `
          <div class="p-3 bg-slate-50/70 flex flex-col justify-center items-center text-center">
            <span class="text-xl">${slot.emoji}</span>
            <span class="text-xs font-black text-slate-800 mt-1 uppercase tracking-tight">${slot.label}</span>
            <span class="text-[10px] font-semibold text-slate-400 mt-0.5">${slot.time}</span>
          </div>
        `;

        weekDays.forEach(day => {
          const slotKey = `${day.dateStr}_${slot.id}`;
          rowHTML += `
            <div id="cell-${slotKey}" 
                 onclick="window.openDetail('${slotKey}', '${day.dayName}', '${day.shortDate}', '${slot.label}', '${slot.emoji}')"
                 class="p-2 min-h-[105px] cursor-pointer transition duration-150 hover:scale-[1.02] hover:z-20 hover:shadow-lg flex flex-col justify-between group relative select-none">
               
               <div class="flex items-center justify-between">
                 <span class="text-[9px] font-extrabold uppercase tracking-tight text-slate-400">${slot.label}</span>
                 <span id="badge-${slotKey}" class="w-2.5 h-2.5 rounded-full bg-slate-200"></span>
               </div>

               <div id="status-${slotKey}" class="my-auto text-center py-1">
                 <span class="text-[11px] font-bold text-slate-400">...</span>
               </div>

               <div id="avatars-${slotKey}" class="flex items-center justify-center -space-x-1 overflow-hidden pt-1">
               </div>
            </div>
          `;
        });

        row.innerHTML = rowHTML;
        bodyContainer.appendChild(row);
      });
    }

    function calculateSlotStatus(slotInfo) {
      if (!slotInfo) {
        return { status: "green", freeCount: MEMBERS.length, murobbiFree: true };
      }

      const isMurobbiFree = slotInfo["kak_nisa"] !== false;

      let freeCount = 0;
      MEMBERS.forEach(m => {
        if (slotInfo[m.id] !== false) freeCount++;
      });

      if (!isMurobbiFree) {
        return { status: "red", reason: "Kak Nisa Sibuk", freeCount, murobbiFree: false };
      }

      if (freeCount <= 1) {
        return { status: "red", reason: "Semua Sibuk", freeCount, murobbiFree: true };
      }

      if (freeCount === MEMBERS.length) {
        return { status: "green", reason: "Semua Free ✨", freeCount, murobbiFree: true };
      }

      return { status: "yellow", reason: `${freeCount}/${MEMBERS.length} Free`, freeCount, murobbiFree: true };
    }

    function updateGridVisuals() {
      weekDays.forEach(day => {
        SLOTS.forEach(slot => {
          const slotKey = `${day.dateStr}_${slot.id}`;
          const cell = document.getElementById(`cell-${slotKey}`);
          const badge = document.getElementById(`badge-${slotKey}`);
          const statusElem = document.getElementById(`status-${slotKey}`);
          const avatarsElem = document.getElementById(`avatars-${slotKey}`);

          if (!cell) return;

          const slotInfo = scheduleData[slotKey] || {};
          const result = calculateSlotStatus(slotInfo);

          cell.className = "p-2 min-h-[105px] cursor-pointer transition duration-150 hover:scale-[1.02] hover:z-20 hover:shadow-md flex flex-col justify-between group relative select-none ";

          if (result.status === "green") {
            cell.classList.add("bg-emerald-50/50", "border", "border-emerald-200/60");
            badge.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-xs shadow-emerald-400";
            statusElem.innerHTML = `
              <span class="inline-flex items-center gap-1 text-[11px] font-black text-emerald-800 bg-white/95 px-2 py-0.5 rounded-full shadow-xs">
                🟢 Boleh Usrah!
              </span>
            `;
          } else if (result.status === "yellow") {
            cell.classList.add("bg-amber-50/50", "border", "border-amber-200/70");
            badge.className = "w-2.5 h-2.5 rounded-full bg-amber-400 shadow-xs shadow-amber-300";
            statusElem.innerHTML = `
              <span class="inline-flex items-center gap-1 text-[11px] font-black text-amber-800 bg-white/95 px-2 py-0.5 rounded-full shadow-xs">
                🟡 ${result.freeCount}/${MEMBERS.length} Free
              </span>
            `;
          } else {
            cell.classList.add("bg-rose-50/80", "occupied-pattern", "border", "border-rose-300/80");
            badge.className = "w-2.5 h-2.5 rounded-full bg-rose-500 shadow-xs shadow-rose-400 animate-pulse";
            statusElem.innerHTML = `
              <span class="inline-flex items-center gap-1 text-[10px] font-black uppercase tracking-wide text-rose-700 bg-white px-2 py-0.5 rounded-md shadow-xs border border-rose-200">
                🚫 Occupied
              </span>
              <div class="text-[10px] font-bold text-rose-600 mt-0.5">${!result.murobbiFree ? "👑 Murobbi Sibuk" : "Semua Penuh"}</div>
            `;
          }

          let avatarsHTML = "";
          MEMBERS.forEach(m => {
            const isFree = slotInfo[m.id] !== false;
            avatarsHTML += `
              <span title="${m.name}: ${isFree ? 'Free' : 'Sibuk'}" 
                    class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] border ${
                      isFree ? 'bg-white border-slate-200 shadow-xs' : 'bg-rose-600 text-white border-white scale-90 opacity-75'
                    }">
                ${m.emoji}
              </span>
            `;
          });
          avatarsElem.innerHTML = avatarsHTML;
        });
      });
    }

    window.openDetail = function(slotKey, dayName, shortDate, slotLabel, slotEmoji) {
      activeSlotKey = slotKey;
      activeSlotMeta = { dayName, shortDate, slotLabel, slotEmoji };

      document.getElementById("modal-date-badge").innerText = `${dayName}, ${shortDate}`;
      document.getElementById("modal-title").innerHTML = `${slotEmoji} Slot ${slotLabel}`;

      const listContainer = document.getElementById("member-list");
      listContainer.innerHTML = "";

      const currentSlot = scheduleData[slotKey] || {};

      MEMBERS.forEach(member => {
        const isFree = currentSlot[member.id] !== false;
        const item = document.createElement("div");
        item.className = `flex items-center justify-between p-3 rounded-2xl border transition-all duration-150 ${
          isFree 
            ? "bg-emerald-50/70 border-emerald-200 text-emerald-950" 
            : "bg-rose-50/80 border-rose-200 text-rose-950"
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-2xl flex items-center justify-center text-lg ${
              member.isMurobbi ? "bg-amber-100 border border-amber-300 shadow-xs" : "bg-white border border-slate-200"
            }">
              ${member.emoji}
            </span>
            <div>
              <div class="text-sm font-extrabold flex items-center gap-1.5">
                ${member.name}
                ${member.isMurobbi ? '<span class="text-[9px] bg-rose-600 text-white font-black px-1.5 py-0.2 rounded-md uppercase">Murobbi</span>' : ''}
              </div>
              <span class="text-xs font-semibold ${isFree ? 'text-emerald-700' : 'text-rose-600'}">
                ${isFree ? "🟢 Boleh Join (Free)" : "🔴 Tak Dapat (Sibuk)"}
              </span>
            </div>
          </div>

          <button onclick="window.toggleStatus('${member.id}', ${!isFree})" 
                  class="relative inline-flex h-7 w-14 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${
                    isFree ? 'bg-emerald-500' : 'bg-rose-500'
                  }">
            <span class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-white shadow-md transition duration-200 ease-in-out flex items-center justify-center text-[10px] ${
              isFree ? 'translate-x-7' : 'translate-x-0'
            }">
              ${isFree ? '✔️' : '✖️'}
            </span>
          </button>
        `;

        listContainer.appendChild(item);
      });

      document.getElementById("detail-modal").classList.remove("hidden");
    };

    window.closeModal = function() {
      document.getElementById("detail-modal").classList.add("hidden");
    };

    window.toggleStatus = async function(memberId, newStatus) {
      if (!scheduleData[activeSlotKey]) scheduleData[activeSlotKey] = {};
      scheduleData[activeSlotKey][memberId] = newStatus;

      try {
        const slotRef = doc(db, "weekly_schedule", activeSlotKey);
        await setDoc(slotRef, scheduleData[activeSlotKey], { merge: true });

        if (activeSlotMeta) {
          window.openDetail(
            activeSlotKey, 
            activeSlotMeta.dayName, 
            activeSlotMeta.shortDate, 
            activeSlotMeta.slotLabel, 
            activeSlotMeta.slotEmoji
          );
        }
      } catch (err) {
        console.error("Gagal simpan ke Firebase:", err);
        alert("Ralat! Pastikan peraturan Firebase Firestore anda membenarkan akses Write.");
      }
    };

    function listenToCurrentWeek() {
      firestoreUnsubscribes.forEach(unsub => unsub());
      firestoreUnsubscribes = [];

      weekDays.forEach(day => {
        SLOTS.forEach(slot => {
          const slotKey = `${day.dateStr}_${slot.id}`;
          const docRef = doc(db, "weekly_schedule", slotKey);

          const unsub = onSnapshot(docRef, (snap) => {
            if (snap.exists()) {
              scheduleData[slotKey] = snap.data();
            } else {
              scheduleData[slotKey] = {};
            }
            updateGridVisuals();

            if (activeSlotKey === slotKey && !document.getElementById("detail-modal").classList.contains("hidden")) {
              window.openDetail(
                slotKey, 
                activeSlotMeta.dayName, 
                activeSlotMeta.shortDate, 
                activeSlotMeta.slotLabel, 
                activeSlotMeta.slotEmoji
              );
            }
          });

          firestoreUnsubscribes.push(unsub);
        });
      });
    }

    window.changeWeek = function(delta) {
      currentWeekOffset += delta;
      initWeekView();
    };

    window.resetToThisWeek = function() {
      currentWeekOffset = 0;
      initWeekView();
    };

    function initWeekView() {
      calculateWeekDates();
      renderCalendarGrid();
      listenToCurrentWeek();
    }

    initWeekView();
  </script>
</body>
</html>
