<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usrah Weekly Availability Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-5">
    <div>
      <div class="flex items-center gap-2">
        <i class="ph ph-calendar-check text-indigo-600 text-3xl"></i>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900">Usrah Circle Schedule</h1>
      </div>
      <p class="text-sm text-slate-500 mt-1">Real-time weekly availability for Kak Nisa & members</p>
    </div>

    <!-- Quick Legend -->
    <div class="flex flex-wrap items-center gap-3 text-xs font-semibold bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> All Free</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400"></span> Partial Free</span>
      <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500"></span> Murobbi Busy / All Full</span>
    </div>
  </header>

  <!-- Weekly Timetable Grid -->
  <main class="max-w-7xl mx-auto overflow-x-auto pb-6">
    <div class="min-w-[850px] bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Days Grid Header -->
      <div class="grid grid-cols-8 border-b border-slate-200 bg-slate-100 text-center font-semibold text-slate-700 text-sm">
        <div class="p-3 border-r border-slate-200 flex items-center justify-center text-slate-500">
          <i class="ph ph-clock mr-1"></i> Slot
        </div>
        <div class="p-3 border-r border-slate-200">Monday</div>
        <div class="p-3 border-r border-slate-200">Tuesday</div>
        <div class="p-3 border-r border-slate-200">Wednesday</div>
        <div class="p-3 border-r border-slate-200">Thursday</div>
        <div class="p-3 border-r border-slate-200">Friday</div>
        <div class="p-3 border-r border-slate-200 text-indigo-600">Saturday</div>
        <div class="p-3 text-indigo-600">Sunday</div>
      </div>

      <!-- Schedule Slots Body -->
      <div id="calendar-body" class="divide-y divide-slate-100">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </div>
  </main>

  <!-- Interactive Modal / Slide Drawer -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 relative border border-slate-100 animate-in fade-in zoom-in-95 duration-150">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
        <i class="ph ph-x text-xl font-bold"></i>
      </button>

      <div class="mb-4">
        <span id="modal-slot-tag" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">Day & Time</span>
        <h3 id="modal-title" class="text-xl font-bold text-slate-900 mt-2">Slot Availability</h3>
        <p class="text-xs text-slate-500">Tap your name to toggle your status.</p>
      </div>

      <!-- Member Availability List -->
      <div id="member-list" class="space-y-2 mb-6">
        <!-- Injected dynamically -->
      </div>

      <button onclick="closeModal()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium transition">
        Done
      </button>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 1. REPLACE THIS WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Group Members List
    const MEMBERS = [
      { id: "kak_nisa", name: "Kak Nisa", isMurobbi: true },
      { id: "nabila", name: "Nabila", isMurobbi: false },
      { id: "fir", name: "Fir", isMurobbi: false },
      { id: "farasya", name: "Farasya", isMurobbi: false },
      { id: "athirah", name: "Athirah", isMurobbi: false },
      { id: "sakinah", name: "Sakinah", isMurobbi: false },
    ];

    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const SLOTS = [
      { id: "morning", label: "Morning", time: "09:00 - 12:00" },
      { id: "afternoon", label: "Afternoon", time: "14:30 - 17:30" },
      { id: "evening", label: "Evening", time: "18:00 - 20:00" },
      { id: "night", label: "Night", time: "20:30 - 22:30" }
    ];

    // Local state mirror synchronized with Firebase
    let scheduleData = {};
    let activeSlotKey = null;

    // Render Skeleton Grid
    function renderGrid() {
      const container = document.getElementById("calendar-body");
      container.innerHTML = "";

      SLOTS.forEach(slot => {
        const row = document.createElement("div");
        row.className = "grid grid-cols-8 items-stretch";

        // Time slot label cell
        let html = `
          <div class="p-3 border-r border-slate-200 bg-slate-50 flex flex-col justify-center items-center text-center">
            <span class="text-xs font-bold text-slate-800">${slot.label}</span>
            <span class="text-[11px] text-slate-500">${slot.time}</span>
          </div>
        `;

        // 7 Day Boxes
        DAYS.forEach(day => {
          const slotId = `${day}_${slot.id}`;
          html += `
            <div id="cell-${slotId}" 
                 onclick="window.openDetail('${slotId}', '${day}', '${slot.label}')"
                 class="p-2 border-r last:border-r-0 border-slate-100 min-h-[95px] cursor-pointer transition hover:scale-[1.01] hover:z-10 flex flex-col justify-between">
               <div class="flex items-center justify-between">
                 <span class="text-[10px] uppercase font-bold text-slate-400">${slot.label}</span>
                 <span id="badge-${slotId}" class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
               </div>
               <div id="summary-${slotId}" class="my-auto py-1 text-center font-medium text-xs">
                 <span class="text-slate-400">Loading...</span>
               </div>
               <div id="bar-${slotId}" class="w-full h-1 rounded-full bg-slate-100 overflow-hidden">
                 <div class="h-full bg-emerald-500 w-full transition-all"></div>
               </div>
            </div>
          `;
        });

        row.innerHTML = html;
        container.appendChild(row);
      });
    }

    // Determine status: Green, Yellow, or Red
    function calculateSlotStatus(slotInfo) {
      if (!slotInfo) {
        return { status: "green", freeCount: MEMBERS.length, murobbiFree: true };
      }

      // If Kak Nisa is set to false (busy), status is RED
      const isMurobbiFree = slotInfo["kak_nisa"] !== false; 
      if (!isMurobbiFree) {
        return { status: "red", reason: "Murobbi Busy", freeCount: 0, murobbiFree: false };
      }

      // Count member availability
      let freeCount = 0;
      MEMBERS.forEach(m => {
        if (slotInfo[m.id] !== false) freeCount++;
      });

      // If all members are busy, it's RED
      if (freeCount <= 1) { // only murobbi or nobody
        return { status: "red", reason: "All Busy", freeCount, murobbiFree: true };
      }

      // If all 6 are free, GREEN
      if (freeCount === MEMBERS.length) {
        return { status: "green", reason: "All Free", freeCount, murobbiFree: true };
      }

      // Otherwise, YELLOW (Kak Nisa is free, but some members are busy)
      return { status: "yellow", reason: `${freeCount}/${MEMBERS.length} Free`, freeCount, murobbiFree: true };
    }

    // Refresh Slot visuals in Realtime
    function updateGridVisuals() {
      DAYS.forEach(day => {
        SLOTS.forEach(slot => {
          const slotId = `${day}_${slot.id}`;
          const cell = document.getElementById(`cell-${slotId}`);
          const badge = document.getElementById(`badge-${slotId}`);
          const summary = document.getElementById(`summary-${slotId}`);
          const bar = document.getElementById(`bar-${slotId}`);

          if (!cell) return;

          const slotData = scheduleData[slotId] || {};
          const statusResult = calculateSlotStatus(slotData);

          // Visual styles depending on status
          cell.className = "p-2 border-r border-slate-100 min-h-[95px] cursor-pointer transition hover:brightness-95 flex flex-col justify-between ";

          if (statusResult.status === "green") {
            cell.classList.add("bg-emerald-50/60", "border-emerald-200/50");
            badge.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm";
            summary.innerHTML = `<span class="text-emerald-700 font-semibold text-[11px]">Everyone Free (${statusResult.freeCount}/${MEMBERS.length})</span>`;
            bar.innerHTML = `<div class="h-full bg-emerald-500 w-full"></div>`;
          } else if (statusResult.status === "yellow") {
            cell.classList.add("bg-amber-50/60", "border-amber-200/50");
            badge.className = "w-2.5 h-2.5 rounded-full bg-amber-400 shadow-sm";
            summary.innerHTML = `<span class="text-amber-700 font-semibold text-[11px]">${statusResult.freeCount}/${MEMBERS.length} Available</span>`;
            const percentage = (statusResult.freeCount / MEMBERS.length) * 100;
            bar.innerHTML = `<div class="h-full bg-amber-400" style="width: ${percentage}%"></div>`;
          } else {
            // RED
            cell.classList.add("bg-rose-50/70", "border-rose-200");
            badge.className = "w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm";
            summary.innerHTML = `<span class="text-rose-600 font-bold text-[11px]">${!statusResult.murobbiFree ? "Kak Nisa Busy" : "Circle Full"}</span>`;
            bar.innerHTML = `<div class="h-full bg-rose-500 w-full"></div>`;
          }
        });
      });
    }

    // Modal Interaction
    window.openDetail = function(slotId, day, slotLabel) {
      activeSlotKey = slotId;
      document.getElementById("modal-slot-tag").innerText = `${day} • ${slotLabel}`;
      document.getElementById("modal-title").innerText = "Circle Availability";

      const listContainer = document.getElementById("member-list");
      listContainer.innerHTML = "";

      const currentSlot = scheduleData[slotId] || {};

      MEMBERS.forEach(member => {
        const isFree = currentSlot[member.id] !== false; // defaults to true
        const item = document.createElement("div");
        item.className = `flex items-center justify-between p-3 rounded-xl border transition cursor-pointer ${
          isFree 
            ? "bg-emerald-50/50 border-emerald-200 text-emerald-950" 
            : "bg-rose-50/50 border-rose-200 text-rose-950 opacity-90"
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
              member.isMurobbi ? "bg-purple-600 text-white shadow-sm" : "bg-slate-200 text-slate-700"
            }">
              ${member.name.charAt(0)}
            </span>
            <div>
              <div class="text-sm font-semibold flex items-center gap-1.5">
                ${member.name}
                ${member.isMurobbi ? '<span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-md font-bold">Murobbi</span>' : ''}
              </div>
              <span class="text-[11px] text-slate-500">${isFree ? "Available" : "Not Available / Busy"}</span>
            </div>
          </div>
          <button class="px-3 py-1 text-xs rounded-lg font-semibold transition ${
            isFree ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
          }">
            ${isFree ? "Free" : "Busy"}
          </button>
        `;

        item.onclick = () => toggleMemberStatus(slotId, member.id, !isFree);
        listContainer.appendChild(item);
      });

      document.getElementById("detail-modal").classList.remove("hidden");
    };

    window.closeModal = function() {
      document.getElementById("detail-modal").classList.add("hidden");
    };

    // Toggle Member status directly to Firebase Firestore
    async function toggleMemberStatus(slotKey, memberId, newStatus) {
      if (!scheduleData[slotKey]) scheduleData[slotKey] = {};
      scheduleData[slotKey][memberId] = newStatus;

      // Save to Firebase (Realtime sync)
      try {
        const slotDocRef = doc(db, "weekly_schedule", slotKey);
        await setDoc(slotDocRef, scheduleData[slotKey], { merge: true });
        
        // Refresh open modal to reflect toggle immediately
        const [day, timeSlot] = slotKey.split("_");
        window.openDetail(slotKey, day, timeSlot);
      } catch (err) {
        console.error("Error saving to Firebase:", err);
        alert("Permission denied. Check your Firestore rules!");
      }
    }

    // Listen to Firebase updates in Real Time
    function listenToFirestore() {
      DAYS.forEach(day => {
        SLOTS.forEach(slot => {
          const slotId = `${day}_${slot.id}`;
          const docRef = doc(db, "weekly_schedule", slotId);
          
          onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
              scheduleData[slotId] = docSnap.data();
            } else {
              scheduleData[slotId] = {};
            }
            updateGridVisuals();
            
            // If user has the modal currently open for this slot, update it live
            if (activeSlotKey === slotId && !document.getElementById("detail-modal").classList.contains("hidden")) {
              window.openDetail(slotId, day, slot.label);
            }
          });
        });
      });
    }

    // Initialize View
    renderGrid();
    listenToFirestore();
  </script>
</body>
</html>
